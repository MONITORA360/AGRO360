 const fx=CR.filter(r=>/Mano|Energ|Praderas|Equipos|Asistencia/.test(r.n)).reduce((a,r)=>a+r.t,0)/12,vr=CR.reduce((a,r)=>a+r.t,0)/12-fx,vl=vr/(lit.reduce((a,b)=>a+b,0)/12),be=fx/(price-vl),xs=[0,be,be*2,be*4,Math.max(...lit)*1.1,Math.max(...lit)*1.3];
 mk('be',{type:'line',data:{datasets:[{label:'Ingresos totales',data:xs.map(x=>({x,y:price*x})),borderColor:C.g,borderWidth:3,pointRadius:0},{label:'Costos totales',data:xs.map(x=>({x,y:fx+vl*x})),borderColor:C.r,borderWidth:3,pointRadius:0},{type:'scatter',label:`Equilibrio ${N(be)} L`,data:[{x:be,y:price*be}],backgroundColor:C.n,pointRadius:9}]},options:{parsing:false,scales:{x:{type:'linear',title:{display:true,text:'Litros/mes'},grid},y:{grid,ticks:{callback:MM}}}}});
 H('be',`<p class="text-xs text-slate-500 mt-1">Fijos ≈ ${MM(fx)}/mes · variable ≈ $${N(vl)}/L · equilibrio ≈ <b class="text-n">${N(be)} L/mes</b> (${N(be/(lit.reduce((a,b)=>a+b,0)/12)*100,0)}% de la producción actual).</p>`);
 lucide.createIcons();
}
/* hoja de vida */
let FC='Todas';
function buildCards(cats){const inv=D.inv,byR=Object.fromEntries(D.rep.map(r=>[r['N° Chapeta'],r])),byC=Object.fromEntries(D.ctl.r.map(r=>[r['N° Chapeta'],r])),byM=Object.fromEntries(D.cmt.map(r=>[r['N° Chapeta'],r]));
 $('#fc').innerHTML=['Todas',...cats].map(c=>`<button class="chip ${c==FC?'on':''}" data-c="${c}">${c}</button>`).join('');
 const col=Object.fromEntries(cats.map((c,i)=>[c,PAL[i]])),mc=D.ctl.h.filter(h=>MES.includes(h));
 const draw=()=>{const q=$('#q').value.toLowerCase(),L=inv.filter(a=>(FC=='Todas'||a['Categoría']==FC)&&Object.values(a).join(' ').toLowerCase().includes(q));$('#cnt').textContent=`(${L.length} de ${inv.length})`;
  $('#hv').innerHTML=L.map(a=>{const id=a['N° Chapeta / ID'],c=col[a['Categoría']],p=byC[id],r=byR[id],m=byM[id];const f=(k,v)=>`<div class="bg-slate-50 rounded-xl p-2.5"><p class="text-[10px] uppercase tracking-wide text-slate-400 font-bold">${k}</p><p class="text-sm font-semibold break-words">${E(v)||'–'}</p></div>`;
   return`<details class="card overflow-hidden"><summary class="p-3 flex items-center gap-3"><div class="w-16 h-16 rounded-2xl overflow-hidden shrink-0 grid place-items-center text-white" style="background:${c}"><img src="${E(a['Foto'])}" loading="lazy" class="w-full h-full object-cover" onerror="this.remove()"><i data-lucide="beef" class="absolute w-6 h-6 -z-0"></i></div><div class="flex-1 min-w-0"><p class="font-extrabold truncate">${E(a['Nombre / Registro'])}</p><p class="text-xs text-slate-500">${E(id)}</p><div class="mt-1 flex gap-1 flex-wrap">${bd(a['Categoría'],c)}${bd(a['Edad (Meses)']+' m','#64748b')}</div></div><i data-lucide="chevron-down" class="chev w-5 h-5 text-slate-400 transition"></i></summary>
   <div class="px-3 pb-3"><img src="${E(a['Foto'])}" loading="lazy" class="w-full max-h-64 object-cover rounded-2xl mb-3" onerror="this.remove()"><div class="grid grid-cols-2 gap-2">${f('Raza',a['Raza / Mestizaje'])}${f('Lote',a['Lote Pastoreo'])}${f('Estado reprod.',a['Estado Reproductivo'])}${f('N° partos',a['N° Partos'])}${f('Días en leche',a['Días en Leche'])}${f('Edad',a['Edad (Meses)']+' meses')}${f('Padre',a['Padre'])}${f('Madre',a['Madre'])}</div>${f('Observaciones BPG',a['Observaciones BPG'])}
   ${p?`<p class="text-xs font-bold mt-3 mb-1 text-b">PRODUCCIÓN · prom. ${N(p['Prom/Vaca'],1)} L/día</p><div class="flex items-end gap-1 h-12">${mc.map(k=>`<div class="flex-1 rounded-t bg-b" style="height:${p[k]/35*100}%" title="${k}: ${p[k]}"></div>`).join('')}</div>`:''}
   ${r?`<p class="text-xs font-bold mt-3 mb-1 text-g">REPRODUCCIÓN</p><div class="grid grid-cols-2 gap-2">${f('Último parto',r['Fecha Último Parto'])}${f('Servicio / IA',r['Fecha Servicio/IA'])}${f('Toro',r['Toro / Pajilla'])}${f('Preñez',r['Diagnóstico Preñez'])}${f('Parto probable',r['Fecha Probable Parto'])}${f('Días abiertos',r['Días Abiertos'])}</div>`:''}
   ${m?`<p class="text-xs font-bold mt-3 mb-1 text-r">MASTITIS CMT · ${E(m['Resultado CMT'])}</p><div class="grid grid-cols-4 gap-1 text-center text-xs">${['Cuarto AI','Cuarto AD','Cuarto PI','Cuarto PD'].map(q=>`<span class="rounded-lg py-1.5 font-bold" style="background:${GC[gr(m[q])]};color:${gr(m[q])>1?'#fff':C.n}">${q.slice(-2)}<br>${E(m[q]).replace('Grado ','G')}</span>`).join('')}</div><p class="text-xs text-slate-500 mt-1">${E(m['Acción Correctiva BPG'])}</p>`:''}</div></details>`}).join('');lucide.createIcons()};
 $('#fc').onclick=e=>{if(e.target.dataset.c){FC=e.target.dataset.c;buildCards(cats)}};$('#q').oninput=draw;draw()}
build();load();
</script>
